backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "portfolio_data"
    label: "Portfolio Data"
    files:
      - file: "content/portfolio.json"
        label: "Portfolio Items"
        name: "portfolio"
        fields:
          - label: "Portfolio Items List"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Thumbnail Image", name: "thumbnail", widget: "image" }
              - { label: "Video URL (YouTube/Vimeo/TikTok)", name: "videoUrl", widget: "string" }