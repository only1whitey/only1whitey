backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "portfolio"
    label: "Cinematic Gallery"
    files:
      - file: "content/portfolio.json"
        label: "Gallery Items"
        name: "gallery"
        fields:
          - { label: "Items", name: "items", widget: "list", fields: [
              { label: "Project Title", name: "title", widget: "string" },
              { label: "Category", name: "category", widget: "select", options: ["Convocation", "Wedding", "Commercial", "Events"] },
              { label: "Thumbnail Image", name: "thumbnail", widget: "image" },
              { label: "Video URL", name: "videoUrl", widget: "string" }
            ]}